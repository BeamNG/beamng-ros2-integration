stages:
  - build

.ros_build_template:
  stage: build
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends locales build-essential cmake git curl python3-colcon-common-extensions
    - locale-gen en_US en_US.UTF-8
    - update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
    - export LANG=en_US.UTF-8
    - export LC_ALL=en_US.UTF-8
  script:
    - /bin/bash -c "source /opt/ros/${ROS_DISTRO}/setup.bash && cd '$CI_PROJECT_DIR' && colcon build --merge-install --packages-select beamng_msgs beamng_ros2"
  artifacts:
    name: "${CI_JOB_NAME}"
    paths:
      - install/
      - build/**/*.so
    expire_in: 1 week

build_humble_ubuntu2204:
  extends: .ros_build_template
  image: ros:humble-ros-base-jammy
  variables:
    ROS_DISTRO: humble

build_jazzy_ubuntu2404:
  extends: .ros_build_template
  image: ros:jazzy-ros-base-noble
  variables:
    ROS_DISTRO: jazzy

build_lyrical_ubuntu2604:
  extends: .ros_build_template
  image: ros:lyrical-ros-base-resolute
  variables:
    ROS_DISTRO: lyrical